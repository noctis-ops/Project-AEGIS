name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit and shadow smoke tests
        run: cargo test --all-targets

      - name: Parquet feature compiles and tests
        run: cargo test --all-targets --features parquet-data

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform initialization
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validation
        run: terraform -chdir=infra/terraform validate

  container:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: project-aegis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
