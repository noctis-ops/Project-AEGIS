[package]
name = "project-aegis"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Five-layer, safety-first Binance USD-M futures trading and simulation engine"
license = "Proprietary"
publish = false

[features]
default = []
parquet-data = ["dep:parquet"]
live-trading = []

[dependencies]
anyhow = "1.0"
arrayvec = { version = "0.7", features = ["serde"] }
async-trait = "0.1"
core_affinity = "0.8"
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"
dashmap = "6.1"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
parquet = { version = "53", optional = true, default-features = false, features = ["snap"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rtrb = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
simd-json = { version = "0.14", features = ["serde_impl"] }
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
